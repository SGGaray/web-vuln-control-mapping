name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      WRANGLER_SEND_METRICS: "false"
    steps:
      # Actions are pinned to full commit SHAs of official releases; Dependabot
      # updates the SHA and the version comment together.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No later step pushes or calls git with credentials, so the token is
          # not left in .git/config where npm install scripts could read it.
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Static export to out/ plus the CSP step; fails if an inline script is
      # not covered or out/_headers would break Cloudflare's limits.
      - run: npm run build
      # After the build, so the tests that check out/ (CSP coverage, the
      # published file list, the 404 rewrite) run against this exact output.
      - run: npm test
      # Validates wrangler.jsonc and the assets that would be uploaded, with no
      # account, token or network upload.
      - run: npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/wrangler-dry-run"
